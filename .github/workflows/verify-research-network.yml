name: Research engine v3 network smoke
on:
  push:
    branches: ['upgrade/research-engine-v3', 'upgrade/quality-gates-v4', 'upgrade/verified-job-corrections']
    paths:
      - 'research_engine.py'
      - 'relevance_policy.py'
      - 'docs/research/exclusions.json'
      - '.github/workflows/verify-research-network.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual no-cost ATS collection without publishing
        run: python3 research_engine.py
      - name: Audit live data and source health
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/daily.json').read_text())
          q=x['quality']
          assert x['engine_version']=='3.0'
          assert q['attempted_sources']>=40
          assert q['successful_sources']>=8
          assert q['failed_sources']==len([s for s in x['sources'] if s['status']=='error'])
          print('V3 smoke:',json.dumps(q,indent=2))
          print('Sample:',[(j['employer'],j['title'],j['posted'],j['fit_score'],j.get('role_family'),j['posted_date_quality']) for j in (x['verified_history']+x['research_pending'])[:12]])
          print('Failed boards:',[(v['name'],v.get('error')) for v in x['sources'] if v['status']=='error'])
          PY
