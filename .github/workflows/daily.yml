name: Daily cybersecurity discovery and dashboard
on:
  schedule:
    # IANA-aware schedule, including Detroit daylight saving time.
    - cron: '0 8 * * *'
      timezone: America/Detroit
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - 'research_engine.py'
      - 'relevance_policy.py'
      - 'resume_fit_profile.json'
      - 'tests/test_relevance.py'
      - 'daily_discovery.py'
      - 'render_daily_report.py'
      - 'sponsors.csv'
      - 'kd_profile.json'
      - '.github/workflows/daily.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-cyber-jobs
  cancel-in-progress: false

jobs:
  discover:
    # Only the repo owner may trigger scans via prefilled GitHub issue.
    # Never use issue title/body as shell input or checkout untrusted PR code.
    if: github.event_name != 'issues' || (github.event.issue.user.login == 'karandarjishack' && github.event.issue.title == 'Run CyberJobs scan')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test core engine
        run: |
          python3 -m py_compile research_engine.py relevance_policy.py daily_discovery.py render_daily_report.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate dashboard and history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('docs/board-v2.html').read_text()
          assert '<script>' in page and '</script>' in page
          Path('/tmp/board.js').write_text(page.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/board.js
          node tests/board-smoke.mjs
          node tests/tracker-smoke.mjs
      - name: Discover public employer ATS jobs
        run: python3 daily_discovery.py
      - name: Validate completeness and evidence
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, date
          from pathlib import Path
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo
          d=json.loads(Path('docs/daily.json').read_text())
          today=datetime.now(ZoneInfo('America/Detroit')).date()
          assert d['engine_version']=='3.0'
          assert d['window']=={'from':(today-timedelta(days=6)).isoformat(),'to':today.isoformat()}
          assert d['quality']['successful_sources']>=8
          assert d['quality']['attempted_sources']==len(d['sources'])
          ids=set()
          for group in ('verified_history','research_pending'):
              for j in d[group]:
                  assert today-timedelta(days=6)<=date.fromisoformat(j['posted'])<=today
                  assert j['id'] not in ids
                  ids.add(j['id'])
                  u=urlparse(j['url'])
                  assert u.scheme=='https' and u.netloc
                  assert j['sponsorship_evidence'] in ('A_verified_posting','B_sponsor_history','C_ask_recruiter')
                  assert j['hiring_manager_name'] is None and j['hiring_manager_email'] is None
          assert all(not j['review_reasons'] for j in d['verified_history'])
          assert all(j['review_reasons'] for j in d['research_pending'])
          queue=json.loads(Path('docs/research/pending.json').read_text())
          assert queue['window']==d['window']
          assert len(queue['jobs'])==len(ids)
          assert all(j['hiring_manager_status']=='Not identified' for j in queue['jobs'])
          print('PASS',len(ids),'7-day records across',d['quality']['successful_sources'],'responding boards')
          PY
      - name: Generate dated HTML and JSON reports
        run: |
          python3 render_daily_report.py
          test -s docs/reports/latest.html
      - name: Record run summary
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('docs/daily.json').read_text())
          q=d['quality']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## CyberJobs v3 daily audit\n\n')
              f.write(f"- Employer ATS sources: **{q['successful_sources']} responded** / {q['attempted_sources']} attempted\n")
              f.write(f"- New 7-day records: **{q['eligible_after_structural_screen']}**\n")
              f.write(f"- Pending verification: **{q['requires_manual_review']}**\n")
              f.write(f"- Source failures: **{q['failed_sources']}** (see docs/daily.json)\n")
              f.write('- Sponsorship history is not proof of vacancy-level H-1B transfer or PERM.\n')
          PY
      - name: Commit validated reports without cross-run rebase conflicts
        run: |
          set -euo pipefail
          git config user.name "cyber-jobs-automation[bot]"
          git config user.email "cyber-jobs-automation@users.noreply.github.com"
          DAY="$(TZ=America/Detroit date +%F)"
          SAFE_DIR="$(mktemp -d)"
          mkdir -p "$SAFE_DIR/reports" "$SAFE_DIR/research"
          # Save only this validated run's files, never a stale full directory.
          cp docs/daily.json "$SAFE_DIR/daily.json"
          cp docs/reports/latest.html "$SAFE_DIR/reports/latest.html"
          cp "docs/reports/$DAY.html" "$SAFE_DIR/reports/$DAY.html"
          cp "docs/reports/$DAY.json" "$SAFE_DIR/reports/$DAY.json"
          cp docs/research/pending.json "$SAFE_DIR/research/pending.json"
          for attempt in 1 2 3; do
            git fetch origin main
            # Rebase would conflict with a previous same-day report. Start
            # from latest main and reapply ONLY this run's validated outputs.
            git reset --hard origin/main
            cp "$SAFE_DIR/daily.json" docs/daily.json
            cp "$SAFE_DIR/reports/latest.html" docs/reports/latest.html
            cp "$SAFE_DIR/reports/$DAY.html" "docs/reports/$DAY.html"
            cp "$SAFE_DIR/reports/$DAY.json" "docs/reports/$DAY.json"
            cp "$SAFE_DIR/research/pending.json" docs/research/pending.json
            git add docs/daily.json docs/reports/latest.html "docs/reports/$DAY.html" "docs/reports/$DAY.json" docs/research/pending.json
            if git diff --cached --quiet; then
              echo "No new differences to publish"
              exit 0
            fi
            git commit -m "Daily validated cybersecurity research: $DAY"
            if git push origin HEAD:main; then
              echo "Validated results published from latest main"
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish after conflict-safe retries; previous reports preserved" >&2
          exit 1
      - name: Close owner scan-request issue after completion
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUM" --comment "CyberJobs scan finished. Review the workflow run under Actions and refresh the dashboard. A scan failure does not overwrite earlier results." || true
